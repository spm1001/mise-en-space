version: 2
# spm1001/jeton is private (bds-sipaba). Dependabot's updater fetches it
# itself and never runs workflow steps, so the CI deploy key can't reach it,
# and git registries take a token, not an SSH key. JETON_READ_TOKEN is a
# fine-grained PAT: jeton only, Contents read-only, 1-year expiry
# (minted 2026-10-08; mise-lahutu).
registries:
  github-jeton:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.JETON_READ_TOKEN}}
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # 7-day wait before a version update is proposed (Sameer, 2026-10-11).
    # Security updates skip cooldowns.
    cooldown:
      default-days: 7
    schedule:
      interval: "monthly"
  - package-ecosystem: "uv"
    directory: "/"
    # 7-day wait before a version update is proposed (Sameer, 2026-10-11).
    # Security updates skip cooldowns.
    cooldown:
      default-days: 7
    registries:
      - github-jeton
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
