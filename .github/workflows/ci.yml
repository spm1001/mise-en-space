name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push made with GITHUB_TOKEN (the Dependabot auto-merge) triggers no
  # workflows, so the merged tree used to reach main — and, via the daily
  # assemble, every user — with no CI verdict (mise-sasoti). The auto-merge
  # now dispatches this workflow after merging; the schedule is the backstop,
  # timed ahead of the 07:00 UTC assemble.
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v8
      # spm1001/jeton is private since 2026-09-23 (bds-sipaba) and the dev
      # source map + the consumer-door tests fetch it by git URL. Route that
      # one repo over SSH with a read-only deploy key; everything else is
      # untouched. The secret exists twice — Actions and Dependabot — because
      # Dependabot-triggered runs only see Dependabot secrets.
      - name: Reach private jeton over a read-only deploy key
        env:
          JETON_DEPLOY_KEY: ${{ secrets.JETON_DEPLOY_KEY }}
        run: |
          test -n "$JETON_DEPLOY_KEY" || { echo "::error::JETON_DEPLOY_KEY secret missing — jeton is private"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$JETON_DEPLOY_KEY" > ~/.ssh/jeton && chmod 600 ~/.ssh/jeton
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global core.sshCommand "ssh -i $HOME/.ssh/jeton -o IdentitiesOnly=yes"
          git config --global url."git@github.com:spm1001/jeton".insteadOf "https://github.com/spm1001/jeton"
      - run: uv sync --all-extras --all-groups
      # poppler-utils backs pdf2image (page counts, thumbnails) — the full
      # flavour assumes it, and count_pdf_pages returns None without it, so
      # its known-answer test can only run honestly with poppler present
      # (mise-releko: the dependency was undeclared and CI sat red from
      # 2026-08-14 until this line).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: uv run pytest
      - name: README skill table matches skills/
        run: |
          curl -fsSL https://raw.githubusercontent.com/spm1001/batterie/main/plugins/batterie/scripts/render-skills.py -o /tmp/render-skills.py
          uv run --script /tmp/render-skills.py . --check
